name: CI

on: [push, pull_request]

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'
      - run: swift build
      - run: swift test
      - run: scripts/build-app.sh 0.0.0-dev
